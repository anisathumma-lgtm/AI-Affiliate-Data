<script>
const KEY='aih_v1',CATS=["Beauty","Personal Care","Home","Kitchen","Organization","Electronics","Gadgets","Computer","Mobile Accessories","Fitness","Sports","Fashion","Travel","Car","Motorcycle","Pet","Baby","Office","Stationery","DIY","Tools","Smart Home","Food Accessories","Seasonal","Viral / Emerging","Problem-Based Products"];
let S={sessions:[],products:[],snaps:[],srcs:[],ana:[]};try{S=JSON.parse(localStorage.getItem(KEY))||S}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clamp=x=>Math.round(Math.max(0,Math.min(100,x))*10)/10,avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0,v=x=>x==null?'N/A':(typeof x=='number'?Math.round(x*10)/10:esc(x));
const status=s=>s>=90?'Exceptional':s>=80?'Strong':s>=70?'Worth Testing':s>=60?'Watch':'Low Priority',COL={Exceptional:'#059669',Strong:'#22c55e','Worth Testing':'#0ea5e9',Watch:'#f59e0b','Low Priority':'#94a3b8'};
const PF=p=>{const t=String(p||'').toLowerCase().replace(/\s/g,'');return/shopee|ช้อปปี้|ช็อปปี้|ชอปปี้|ช๊อปปี้|ช้อปปิ้|ช็อปปิ้/.test(t)?'Shopee':/lazada|ลาซาด้า|ลาซาดา|บาซาด้า/.test(t)?'Lazada':/tiktok|ติ๊กต็อก|ติ๊กตอก|ติกต็อก|ติ๊กต๊อก|ติกตอก|ติ๊กต๊อก/.test(t)?'TikTok Shop':null};
const norm=s=>s.toLowerCase().replace(/[^\p{L}\p{N}\s]/gu,' ').replace(/\s+/g,' ').trim();

function sim(a,b){if(a==b)return 1;const bg=s=>{const m=new Map;for(let i=0;i<s.length-1;i++){const g=s.slice(i,i+2);m.set(g,(m.get(g)||0)+1)}return m},A=bg(a),B=bg(b);let x=0;A.forEach((n,g)=>x+=Math.min(n,B.get(g)||0));return 2*x/Math.max(1,a.length+b.length-2)}
function validate(p){const e=[];if(typeof p!='object'||!p)return['โครงสร้างสินค้าไม่ถูกต้อง'];
 for(const k of['product_name','category','platform','product_url','source_url'])if(!p[k]||typeof p[k]!='string')e.push(k+' ขาดหาย');
 if(p.platform&&typeof p.platform=='string'&&!PF(p.platform))e.push('platform ต้องเป็น Lazada, Shopee หรือ TikTok Shop เท่านั้น (พบ: '+p.platform+')');
 for(const k of['product_url','source_url'])if(p[k]){try{if(!/^https?:$/.test(new URL(p[k]).protocol))throw 0}catch{e.push(k+' ไม่ใช่ URL ที่ถูกต้อง')}}
 const nn=(k,f)=>{if(p[k]!=null&&(typeof p[k]!='number'||!isFinite(p[k])||f(p[k])))e.push(k+' ไม่ถูกต้อง')};
 nn('price',x=>x<0);nn('rating',x=>x<0||x>5);nn('review_count',x=>x<0||!Number.isInteger(x));nn('sold_count',x=>x<0||!Number.isInteger(x));return e}
function analyze(p,sn,nsrc,nses,ev){const s=sn[sn.length-1],why=[],d=[];
 if(s.rc!=null)d.push(Math.min(100,Math.log10(s.rc+1)/4*100));if(s.sc!=null)d.push(Math.min(100,Math.log10(s.sc+1)/5*100));if(s.rating!=null)d.push((s.rating-3)/2*100);d.push(Math.min(100,nsrc*33));
 const hist=sn.length>1;let tr=50;if(hist){const a=sn[0].rc,b=s.rc;if(a&&b!=null){const g=(b-a)/a*100;tr=50+g;why.push(`review_count ${g>=0?'+':''}${Math.round(g)}% (${a}→${b})`)}tr+=Math.min(Math.max(nses-1,0),3)*5}else why.push('ยังไม่มีข้อมูลย้อนหลัง: Trend ใช้ค่ากลาง 50 และลด Confidence');
 const K=["demo","before","after","ก่อน","หลัง","แก้ปัญหา","interactive","อัตโนมัติ","automatic","led","พกพา","portable","mini","แม่เหล็ก","magnetic","พับ","foldable","smart","ไร้สาย","wireless","ทำความสะอาด","clean","เปรียบเทียบ","set","ชุด","viral"],t=(p.name+' '+ev+' '+p.cat).toLowerCase(),h=K.filter(k=>t.includes(k)),V=["gadgets","pet","kitchen","home","beauty","smart home","viral / emerging","problem-based products","diy","organization"];
 why.push('Content signals: '+(h.slice(0,5).join(', ')||'ไม่พบคำที่บ่งชี้ชัดเจน'));
 const i=[];if(s.price!=null)i.push(s.price<=300?90:s.price<=800?70:s.price<=2000?50:30);if(s.rc!=null)i.push(Math.min(100,Math.log10(s.rc+1)/4*100));if(s.rating!=null)i.push((s.rating-3)/2*100);
 const ck=s.rc!=null,comp=ck?100-Math.log10(s.rc+1)/6*100:50;why.push(ck?'Competition เป็น proxy จากจำนวนรีวิว ไม่ใช่ข้อมูลจริง':'ไม่มีข้อมูลพอประเมิน Competition (ใช้ 50)');
 const R={demand:clamp(avg(d)),trend:clamp(tr),content:clamp(35+8*Math.min(h.length,5)+(V.includes(p.cat.toLowerCase())?10:0)),intent:clamp(avg(i)),comp:clamp(comp),conf:clamp(30+(s.price!=null?10:0)+(s.rating!=null?10:0)+(s.rc!=null?15:0)+(nsrc>1?15:0)+(hist?10:0)+(ev?10:0))};
 R.score=clamp(R.demand*.25+R.trend*.2+R.content*.25+R.intent*.15+R.comp*.1+R.conf*.05);R.status=status(R.score);R.why=why.join(' | ');return R}
function doImport(txt){let j;try{j=JSON.parse(txt.replace(/[“”]/g,'"'))}catch(e){return{fatal:['JSON ไม่ถูกต้อง: '+e.message]}}if(Array.isArray(j))j={research_id:'IMPORT-'+Date.now(),keyword:'Uploaded data',products:j};
 if(!j||typeof j!='object'||!j.research_id||!Array.isArray(j.products))return{fatal:['ต้องมี research_id และ products (array)']};
 if(S.sessions.some(s=>s.rid==j.research_id))return{fatal:[`research_id '${j.research_id}' ถูก import แล้ว (ใช้ id ใหม่)`]};
 const at=j.searched_at&&!isNaN(Date.parse(j.searched_at))?new Date(j.searched_at).toISOString():new Date().toISOString(),sid=S.sessions.length+1,demo=String(j.research_id).toUpperCase().startsWith('DEMO'),r={imported:0,nw:0,dup:0,pd:0,inc:0,ok:0,errors:[]};
 j.products.forEach((it,ix)=>{const e=validate(it);if(e.length)return r.errors.push(`สินค้าที่ ${ix+1} ถูกข้าม: ${e.join('; ')}`);
  it.platform=PF(it.platform);const n=norm(it.product_name),cu=canon(it.product_url);let p=S.products.find(x=>x.canon==cu)||S.products.find(x=>x.norm==n&&x.platform==it.platform);
  if(p)r.dup++;else{const d=S.products.find(x=>x.platform==it.platform&&sim(n,x.norm)>=.85);p={id:S.products.length+1,name:it.product_name,norm:n,brand:it.brand||null,cat:it.category,platform:it.platform,url:it.product_url,canon:cu,dupOf:d?d.id:null,demo,created:at};S.products.push(p);r.nw++;if(d)r.pd++}
  S.srcs.push({pid:p.id,sid,url:it.source_url,title:it.source_title||null,ev:it.evidence||null,at});
  S.snaps.push({pid:p.id,sid,date:at,price:it.price??null,rating:it.rating??null,rc:it.review_count??null,sc:it.sold_count??null});
  if(it.price==null||it.rating==null||it.review_count==null)r.inc++;r.imported++;
  const sn=S.snaps.filter(x=>x.pid==p.id),ss=S.srcs.filter(x=>x.pid==p.id);
  S.ana.push({pid:p.id,date:at,...analyze(p,sn,new Set(ss.map(x=>x.url)).size,new Set(ss.map(x=>x.sid)).size,ss.map(x=>x.ev||'').join(' ').trim())});r.ok++});
 S.sessions.push({id:sid,rid:j.research_id,kw:j.keyword,cat:j.category,at,by:j.researcher,n:r.imported,nw:r.nw,dup:r.dup,imp:new Date().toISOString()});save();return r}
const rowOf=p=>{const sn=S.snaps.filter(x=>x.pid==p.id).pop(),a=S.ana.filter(x=>x.pid==p.id).pop();return{...p,...sn,...a}};
const rows=()=>S.products.filter(p=>PF(p.platform)).map(rowOf);
function tbl(a){if(!a.length)return'<p class="mu">ไม่มีข้อมูล</p>';return`<div class="w"><table><tr>${['Product','Category','Price','Rating','Reviews','Demand','Trend','Content','Intent','Competition','Confidence','Score','Status'].map(h=>`<th>${h}</th>`).join('')}</tr>${a.map(r=>`<tr><td style="white-space:normal;min-width:180px"><a onclick="detail(${r.id})">${esc(r.name)}</a> <a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer" title="เปิดลิงก์สินค้า">↗</a>${r.demo?'<span class="tag">DEMO</span>':''}${r.dupOf?'<span class="tag">possible dup</span>':''}</td><td>${esc(r.cat)}</td>${[r.price,r.rating,r.rc,r.demand,r.trend,r.content,r.intent,r.comp,r.conf].map(x=>`<td>${v(x)}</td>`).join('')}<td><b>${v(r.score)}</b></td><td><span class="b" style="background:${COL[r.status]}">${r.status}</span></td></tr>`).join('')}</table></div>`}
const best=(a,k,f=()=>1)=>a.filter(f).sort((x,y)=>y[k]-x[k]).slice(0,8);
const views={
dash(){const a=rows(),td=new Date().toISOString().slice(0,10),nt=a.filter(r=>r.created.slice(0,10)==td),C=[['Products',a.length],['Added today',nt.length],['Research sessions',S.sessions.length],['New opportunities',nt.filter(r=>r.score>=70).length],['Rising',a.filter(r=>r.trend>=65).length],['Score ≥ 80',a.filter(r=>r.score>=80).length]],sec=(t,r)=>`<h2>${t}</h2>${tbl(r)}`;
 return`<h1>Dashboard</h1>${tools()}${a.length?'':'<div class="c">ยังไม่มีข้อมูล — ไปที่ <span class="lk" onclick="go(\'imp\')">Import</span> แล้ว paste JSON (หรือกด Load DEMO JSON เพื่อทดสอบ)</div>'}<div class="g">${C.map(c=>`<div class="c"><div class="n">${c[1]}</div><div class="mu">${c[0]}</div></div>`).join('')}</div>`+
 sec('🔥 Best Opportunities',best(a,'score'))+sec('📈 Rising Products',best(a,'trend',r=>r.trend>=65))+sec('🆕 New Products',nt.slice(0,8))+sec('🎬 High Content Potential',best(a,'content'))+sec('🛒 High Purchase Intent',best(a,'intent'))+sec('⚠️ Low Confidence / Need More Data',a.filter(r=>r.conf<40).slice(0,8))},
opp(){const f=window.F||(window.F={cat:'',min:0,sort:'score'}),K={score:'score',trend:'trend',content:'content',intent:'intent',newest:'created'};
 const a=rows().filter(r=>r.conf>=40&&r.score>=f.min&&(!f.cat||r.cat==f.cat)&&(!f.plat||r.platform==f.plat)).sort((x,y)=>x[K[f.sort]]<y[K[f.sort]]?1:-1);
 return`<h1>Opportunities</h1>${tools()}<div class="f"><select onchange="F.cat=this.value;go('opp')"><option value="">All categories</option>${CATS.map(c=>`<option ${c==f.cat?'selected':''}>${c}</option>`).join('')}</select><select onchange="F.plat=this.value;go('opp')"><option value="">All platforms</option>${['Lazada','Shopee','TikTok Shop'].map(c=>`<option ${c==f.plat?'selected':''}>${c}</option>`).join('')}</select><input type="number" placeholder="Min score" value="${f.min||''}" onchange="F.min=+this.value;go('opp')"><select onchange="F.sort=this.value;go('opp')">${Object.entries({score:'Highest Score',trend:'Highest Trend',content:'Highest Content',intent:'Highest Intent',newest:'Newest'}).map(([k,t])=>`<option value="${k}" ${k==f.sort?'selected':''}>${t}</option>`).join('')}</select></div><p class="mu">แสดงเฉพาะสินค้าที่ Data Confidence ≥ 40</p>${tbl(a)}`},
res(){return`<h1>Research History</h1>${S.sessions.length?`<div class="w"><table><tr>${['Research ID','Keyword','Category','Date','Products','New','Duplicates'].map(h=>`<th>${h}</th>`).join('')}</tr>${[...S.sessions].reverse().map(s=>`<tr><td><a onclick="sess(${s.id})">${esc(s.rid)}</a></td><td>${esc(s.kw)}</td><td>${esc(s.cat)}</td><td>${s.at.slice(0,10)}</td><td>${s.n}</td><td>${s.nw}</td><td>${s.dup}</td></tr>`).join('')}</table></div>`:'<p class="mu">ยังไม่มี Research</p>'}`},

function demoJSON(){const k=S.sessions.filter(s=>String(s.rid).startsWith('DEMO')).length;return JSON.stringify({research_id:'DEMO-'+Date.now(),keyword:'DEMO DATA - testing only',category:'Mixed',searched_at:new Date().toISOString(),researcher:'DEMO',products:DB.map((d,i)=>({product_name:'DEMO '+d[0],category:d[1],platform:d[2],product_url:'https://example.com/p/'+i,source_url:'https://example.com/s/'+i,price:d[3],rating:d[4],review_count:d[5]==null?null:Math.round(d[5]*(1+.1*k)),evidence:d[6]||null}))},null,1)}
function csv(t){const R=[];let r=[],c='',q=0;for(let i=0;i<t.length;i++){const h=t[i];if(q){if(h=='"'&&t[i+1]=='"'){c+='"';i++}else if(h=='"')q=0;else c+=h}else if(h=='"')q=1;else if(h==','){r.push(c);c=''}else if(h=='\n'||h=='\r'){if(h=='\r'&&t[i+1]=='\n')i++;r.push(c);c='';R.push(r);r=[]}else c+=h}if(c||r.length){r.push(c);R.push(r)}return R.filter(x=>x.some(y=>y.trim()))}

  Notes:[{Note:'System-derived opportunity score, not a guarantee of affiliate sales.'},{Note:'Blank cell = no data in source (never estimated). Competition: 100 = easy.'}]};
 if(typeof XLSX=='undefined'){const k=Object.keys(sh.Products[0]),q=x=>'"'+String(x??'').replace(/"/g,'""')+'"';return dl(new Blob(['\uFEFF'+[k.map(q).join(',')].concat(sh.Products.map(r=>k.map(c=>q(r[c])).join(','))).join('\n')],{type:'text/csv'}),'affiliate-products-'+stamp()+'.csv')}
 const wb=XLSX.utils.book_new();for(const[n,d]of Object.entries(sh)){const w=XLSX.utils.json_to_sheet(d);w['!cols']=Object.keys(d[0]||{A:1}).map(k=>({wch:Math.min(40,Math.max(10,k.length+2))}));XLSX.utils.book_append_sheet(wb,w,n)}
 XLSX.writeFile(wb,'affiliate-hub-'+stamp()+'.xlsx')}
function ask(m,cb){const d=document.createElement('div');d.style.cssText='position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;z-index:99;padding:16px';d.innerHTML=`<div class="c" style="max-width:380px;width:100%"><p style="white-space:pre-line">${esc(m)}</p><p style="display:flex;gap:8px;justify-content:flex-end"><button class="btn s">${cb?'ยกเลิก':'ตกลง'}</button>${cb?'<button class="btn" style="background:#dc2626">ยืนยัน</button>':''}</p></div>`;const b=d.querySelectorAll('button');b[0].onclick=()=>d.remove();if(cb)b[1].onclick=()=>{d.remove();cb()};document.body.appendChild(d)}
const note=m=>ask(m);
function resetAll(){ask('ลบข้อมูลทั้งหมดและรีเซ็ตเป็น 0? (สินค้า, Research, Snapshot, คะแนน)\nแนะนำให้กด Backup JSON ก่อน — การลบนี้กู้คืนไม่ได้',()=>{S={sessions:[],products:[],snaps:[],srcs:[],ana:[]};try{localStorage.removeItem(KEY)}catch(e){}save();window.F=null;go('dash')})}
function backup(){dl(new Blob([JSON.stringify(S)],{type:'application/json'}),'affiliate-hub-backup-'+stamp()+'.json')}
function restore(i){const f=i.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const o=JSON.parse(rd.result);if(!['sessions','products','snaps','srcs','ana'].every(k=>Array.isArray(o[k])))throw 0;ask(`Restore: ${o.products.length} products — จะแทนที่ข้อมูลปัจจุบัน ต้องการต่อไหม?`,()=>{S=o;save();go('dash')})}catch{note('ไฟล์ Backup ไม่ถูกต้อง')}};rd.readAsText(f)}
function bind(){const g=$('#doimp');if(!g)return;$('#demo').onclick=()=>$('#t').value=demoJSON();$('#fl').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{$('#t').value=/\.csv$/i.test(f.name)?csvToJson(rd.result,f.name):rd.result};rd.readAsText(f)};g.onclick=()=>{const r=doImport($('#t').value);$('#o').innerHTML=r.fatal?`<div class="err">${r.fatal.map(esc).join('<br>')}</div>`:`<div class="ok"><b>Import สำเร็จ</b><br>นำเข้า ${r.imported} · สินค้าใหม่ ${r.nw} · Duplicate ${r.dup} · possible duplicate ${r.pd}<br>ข้อมูลไม่ครบ ${r.inc} · วิเคราะห์สำเร็จ ${r.ok}${r.errors.map(e=>`<br><span style="color:#991b1b">${esc(e)}</span>`).join('')}</div>`}}
function go(v){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v==v));$('#m').innerHTML=views[v]();bind();scrollTo(0,0)}
function sess(id){const s=S.sessions.find(x=>x.id==id),ids=new Set(S.srcs.filter(x=>x.sid==id).map(x=>x.pid));$('#m').innerHTML=`<h1>${esc(s.rid)}</h1><p class="mu">${esc(s.kw)} · ${esc(s.cat)} · ${s.n} products</p>${tbl(S.products.filter(p=>ids.has(p.id)).map(rowOf))}`}
function spark(a){a=a.filter(x=>x!=null);if(a.length<2)return'<span class="mu">ข้อมูลไม่พอ</span>';const mn=Math.min(...a),r=Math.max(...a)-mn||1;return`<svg viewBox="0 0 300 80" style="width:100%;height:80px"><polyline fill="none" stroke="var(--ac)" stroke-width="2" points="${a.map((x,i)=>`${i/(a.length-1)*280+10},${70-(x-mn)/r*60}`).join(' ')}"/></svg>`}
function detail(id){const p=S.products.find(x=>x.id==id),r=rowOf(p),sn=S.snaps.filter(x=>x.pid==id),hs=S.ana.filter(x=>x.pid==id),B=[['Demand','demand'],['Trend','trend'],['Content Potential','content'],['Purchase Intent','intent'],['Competition (100 = easy)','comp'],['Confidence','conf']],box=(t,h)=>`<div class="c" style="margin-top:12px"><h2 style="margin-top:0">${t}</h2>${h}</div>`;
 $('#m').innerHTML=`<h1>${esc(p.name)}${p.demo?'<span class="tag">DEMO DATA</span>':''}</h1>`+box('Product Overview',`<div class="g">${[['Brand',p.brand],['Category',p.cat],['Platform',p.platform],['Price',r.price],['Rating',r.rating],['Reviews',r.rc]].map(x=>`<div><div class="mu">${x[0]}</div>${v(x[1])}</div>`).join('')}</div><p><a class="btn" style="display:inline-block" href="${esc(p.url)}" target="_blank" rel="noopener noreferrer">🔗 เปิดหน้าสินค้าบน ${esc(p.platform)}</a></p><p class="mu" style="word-break:break-all">${esc(p.url)}</p>`)+
 box('Affiliate Score',`<span class="big">${r.score}</span> <span class="b" style="background:${COL[r.status]}">${r.status}</span><div class="g" style="margin-top:10px">${B.map(b=>`<div><div class="mu">${b[0]} · ${r[b[1]]}</div><div class="bar"><i style="width:${r[b[1]]}%"></i></div></div>`).join('')}</div><p class="mu">System-derived opportunity score, not a guarantee of affiliate sales.</p>`)+
 box('Why this product?',`<p>${esc(r.why)}</p><p class="mu">AI INSIGHT / SIGNAL — คำนวณจากข้อมูลที่มี ไม่ใช่ยอดขายจริง</p>`)+
 box('Sources',S.srcs.filter(x=>x.pid==id).map(s=>`<div style="border-top:1px solid var(--bd);padding:6px 0"><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title||s.url)}</a><div>${esc(s.ev||'N/A')}</div><div class="mu">Retrieved ${s.at.slice(0,10)}</div></div>`).join(''))+
 box('Historical Data',sn.length<2?'<p class="mu">No historical data available yet.</p>':`<div class="g">${[['Review Count',sn.map(x=>x.rc)],['Price',sn.map(x=>x.price)],['Score',hs.map(x=>x.score)]].map(x=>`<div><div class="mu">${x[0]}</div>${spark(x[1])}</div>`).join('')}</div>`)}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.v));$('#rst').onclick=resetAll;go('dash');
</script></body></html>
